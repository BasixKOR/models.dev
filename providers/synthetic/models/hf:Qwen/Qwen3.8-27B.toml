# Always-on model reference: https://dev.synthetic.new/docs/api/models#always-on-models
# Synthetic lists hf:Qwen/Qwen3.8-27B with effort controls low|medium|xhigh.
base_model = "alibaba/qwen3.8-27b"
reasoning_options = [{ type = "effort", values = ["low", "medium", "xhigh"] }]

[interleaved]
field = "reasoning_content"

[cost]
input = 0.45
output = 2.2
cache_read = 0.09

[limit]
output = 65_536

[modalities]
input = ["text", "image"]
output = ["text"]
